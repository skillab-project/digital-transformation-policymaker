services:
  policy-success-evaluator:
    container_name: policy-success-evaluator
    build: .
    image: ${DOCKER_REG}${DOCKER_REPO}${APP_NAME}:${DOCKER_TAG}
    env_file:
      - .env
    environment:
      API_URL: ${API_URL}
      API_TOKEN: ${API_TOKEN}
      POLICY_BASE: "http://backend-policy:8080"
    ports:
      - "8878:8878"
    networks:
      - shared-net
    restart: unless-stopped
    labels:
      io.portainer.accesscontrol.teams: skillab-all

networks:
  shared-net:
    external: true
    name: shared-net
